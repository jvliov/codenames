services:
  # Backend Node.js Server
  - type: web
    name: codenames-server
    runtime: node
    env: node
    region: oregon
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: CLIENT_URL
        sync: false
        # Set this to your frontend URL after deployment (e.g., https://codenames-client.onrender.com)

  # Frontend React App
  - type: web
    name: codenames-client
    runtime: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    envVars:
      - key: VITE_SERVER_URL
        sync: false
        # Set this to your backend URL after deployment (e.g., https://codenames-server.onrender.com)
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
